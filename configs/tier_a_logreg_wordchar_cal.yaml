# Tier A ladder, rung 2: rung 1 + char_wb 3-5 grams. Single delta vs
# tier_a_logreg_word_cal: features.char.enabled  false -> true. Everything else
# (model, params, split, word block, seed) is byte-for-byte identical so the
# paired CAL delta isolates the contribution of the char block.
model:
  runner: tier_a
  name: tier_a_logreg_wordchar_cal
  family: logreg          # logreg | complement_nb
  params:
    C: 1.0                # inverse L2 strength
    max_iter: 200         # SAGA cap; kept modest so a 300k-doc fit is laptop-tractable
    tol: 1.0e-3           # SAGA stopping tol; loosened from 1e-4 for the same reason
data:
  split: cal
  train_split: train
  text_column: narrative
  label_column: class
  order_column: complaint_id
features:
  word:
    enabled: true
    ngram_range: [1, 2]
    min_df: 5             # drop hapax/near-hapax word n-grams
    max_features: 150000  # caps the LogReg problem width for tractability
    sublinear_tf: true
  char:
    enabled: true         # <-- the single delta vs rung 1
    ngram_range: [3, 5]
    min_df: 5
    max_features: 150000  # caps char_wb vocabulary explosion
    sublinear_tf: true
calibration: none         # none | isotonic
seed: 20260805
