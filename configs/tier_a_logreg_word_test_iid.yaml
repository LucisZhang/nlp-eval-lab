# Phase 5 §6.3.4 sensitivity arm, CLEAN baseline: LogReg on WORD n-grams only,
# isotonic-calibrated on CAL, evaluated on TEST-IID. Exists to answer one question
# the two frozen finals cannot: do the char_wb 3-5-grams buy robustness to
# character-level noise, or do they just add clean-data accuracy? Comparing this
# arm's perturbation deltas with tier_a_logreg_test_iid's isolates that.
#
# Single delta vs tier_a_logreg_word_cal: split cal -> test_iid, plus the isotonic
# calibration the reported finals use. Features are byte-identical to that CAL rung.
model:
  runner: tier_a
  name: tier_a_logreg_word_test_iid
  family: logreg          # logreg | complement_nb
  params:
    C: 1.0                # inverse L2 strength
    max_iter: 200         # SAGA cap; kept modest so a 300k-doc fit is laptop-tractable
    tol: 1.0e-3           # SAGA stopping tol; loosened from 1e-4 for the same reason
data:
  split: test_iid
  train_split: train
  cal_split: cal          # isotonic calibration is fit here, disjoint from test_iid
  text_column: narrative
  label_column: class
  order_column: complaint_id
features:
  word:
    enabled: true
    ngram_range: [1, 2]
    min_df: 5
    max_features: 150000
    sublinear_tf: true
  char:
    enabled: false        # word-only sensitivity arm: no char n-grams to absorb the noise
    ngram_range: [3, 5]
    min_df: 5
    max_features: 150000
    sublinear_tf: true
calibration: isotonic     # none | isotonic
seed: 20260805
