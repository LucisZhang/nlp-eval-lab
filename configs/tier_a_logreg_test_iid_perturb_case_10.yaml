# Phase 5 §6.3.4 perturbation-robustness arm. SINGLE delta vs the frozen clean
# TEST-IID final tier_a_logreg_test_iid (run 8e4d6345): the data.perturbation
# block below. Same model, same features, same seed, same TRAIN fit, same CAL
# isotonic calibration — only the EVAL narratives are rewritten, per complaint_id,
# after loading and before featurization.
#
# Case mangling: per alphabetic character, flip its case. NOTE: both Tier A
# TF-IDF blocks use lowercase=true, so this arm is a STRUCTURAL ZERO for
# Tier A (delta exactly 0, CI [0,0]). It is run anyway as the plumbing
# control, and it is the arm that will matter for Tier B/C.
# rate = independent per-eligible-site probability (see perturb.py), not the
# fraction of the document rewritten.
model:
  runner: tier_a
  name: tier_a_logreg_test_iid_perturb_case_10
  family: logreg          # logreg | complement_nb
  params:
    C: 1.0                # inverse L2 strength
    max_iter: 200         # SAGA cap; kept modest so a 300k-doc fit is laptop-tractable
    tol: 1.0e-3           # SAGA stopping tol; loosened from 1e-4 for the same reason
data:
  split: test_iid
  train_split: train
  cal_split: cal          # isotonic calibration is fit here, disjoint from test_iid
  text_column: narrative
  label_column: class
  order_column: complaint_id
  perturbation:           # EVAL text only; TRAIN and CAL are read clean
    family: case
    rate: 0.10
    seed: 20260805        # frozen repo-wide perturbation seed
features:
  word:
    enabled: true
    ngram_range: [1, 2]
    min_df: 5
    max_features: 150000
    sublinear_tf: true
  char:
    enabled: true
    ngram_range: [3, 5]
    min_df: 5
    max_features: 150000
    sublinear_tf: true
calibration: isotonic     # none | isotonic
seed: 20260805
