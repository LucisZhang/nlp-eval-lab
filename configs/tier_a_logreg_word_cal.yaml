# Tier A ladder, rung 1: LogReg on word n-grams ONLY, uncalibrated, eval on CAL.
# Iteration split is CAL (never a TEST-* slice). This is the base of the ladder;
# the next rung (tier_a_logreg_wordchar_cal) flips ONLY features.char.enabled.
model:
  runner: tier_a
  name: tier_a_logreg_word_cal
  family: logreg          # logreg | complement_nb
  params:
    C: 1.0                # inverse L2 strength
    max_iter: 200         # SAGA cap; kept modest so a 300k-doc fit is laptop-tractable
    tol: 1.0e-3           # SAGA stopping tol; loosened from 1e-4 for the same reason
data:
  split: cal
  train_split: train
  text_column: narrative
  label_column: class
  order_column: complaint_id
features:
  word:
    enabled: true
    ngram_range: [1, 2]
    min_df: 5             # drop hapax/near-hapax word n-grams
    max_features: 150000  # caps the LogReg problem width for tractability
    sublinear_tf: true
  char:
    enabled: false        # word-only rung; the char block is the single next delta
    ngram_range: [3, 5]
    min_df: 5
    max_features: 150000
    sublinear_tf: true
calibration: none         # none | isotonic
seed: 20260805
