# Tier C SMOKE (few-shot) — cost-gate + plumbing proof, NOT a reported model.
#
# 25 seeded-subsample CAL rows through Claude Haiku 4.5 via OpenRouter (CLAUDE.md rule 6),
# frozen prompt bundle v1, full 9-shot (one exemplar per class). Purpose: prove the
# end-to-end path (env key -> /models pricing -> structured-output call -> receipt log ->
# harness metrics + measured cost) and gate the real Tier C budget on a real per-call
# $/1k figure BEFORE spending it. Metrics are noisy by construction at n=25. Eval is on
# CAL (never TEST-*); the harness run for this config MUST use --no-append (its record
# never enters results/runs.jsonl).
#
# Single-variable pair: tier_c_haiku_smoke_zeroshot_cal.yaml is identical except
# prompt.num_exemplars: 0. Do not diverge any other field.
#
# slug: OpenRouter model id. Verified against the /models endpoint at runtime; if the
# 4.5-Haiku slug differs from anthropic/claude-haiku-4.5, find_model_pricing fails loud
# and lists the available anthropic/* slugs.
model:
  runner: tier_c
  name: tier_c_haiku_smoke_fewshot_cal
  slug: anthropic/claude-haiku-4.5
  params:
    temperature: 0.0
    max_tokens: 64          # output is just {"label": "<class>"}; 64 is ample headroom
    request_timeout_s: 60
    max_retries: 3          # transport/429/5xx only; parse failures use the fallback label
prompt:
  version: v1
  num_exemplars: 9          # full few-shot: one frozen exemplar per class
data:
  split: cal
  eval_rows_cap: 25         # seeded subsample; frozen split file untouched
  cap_seed: 20260806
  text_column: narrative
  label_column: class
  order_column: complaint_id
seed: 20260806
