# Tier C ABLATION (zero-shot arm) — APPROVED few-shot-vs-zero-shot study on CAL (~$6 total).
#
# Single-variable partner of tier_c_haiku_ablation_fewshot_cal.yaml: IDENTICAL except
# prompt.num_exemplars: 0 (the §6.2 zero-shot variant — same system + template, no exemplar
# pairs). 1,500 seeded-subsample CAL rows through Claude Haiku 4.5 via OpenRouter (CLAUDE.md
# rule 6), frozen prompt bundle v1. PAIRED with the few-shot arm: same eval_rows_cap: 1500
# and same cap_seed (20260806) -> the IDENTICAL 1,500 CAL rows, so the comparison is paired.
#
# Iteration on CAL (never TEST-*). Run with --no-append; compare via triage_lab.tier_c_compare
# over the two arms' raw receipts. max_concurrency: 8 to keep the ~1,500-call arm short.
model:
  runner: tier_c
  name: tier_c_haiku_ablation_zeroshot_cal
  slug: anthropic/claude-haiku-4.5
  params:
    temperature: 0.0
    max_tokens: 64          # output is just {"label": "<class>"}; 64 is ample headroom
    request_timeout_s: 60
    max_retries: 3          # transport/429/5xx only; parse failures use the fallback label
    max_concurrency: 8      # ThreadPoolExecutor fan-out; predictions stay id-aligned
prompt:
  version: v1
  num_exemplars: 0          # zero-shot arm: no exemplar pairs, same system + template
data:
  split: cal
  eval_rows_cap: 1500       # seeded subsample; frozen split file untouched
  cap_seed: 20260806        # SAME as the few-shot arm -> identical paired row set
  text_column: narrative
  label_column: class
  order_column: complaint_id
seed: 20260806
