[project]
name = "triage-lab"
version = "0.1.0"
description = "Triage Router Lab — three-tier complaint-triage evaluation with a routing-policy centerpiece"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
