[project]
name = "triage-lab"
version = "0.1.0"
description = "Triage Router Lab — three-tier complaint-triage evaluation with a routing-policy centerpiece"
requires-python = ">=3.12"
dependencies = [
    "datasketch>=2.0.0",
    "duckdb>=1.0",
    "numpy>=2.5.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
tierb = [
    "accelerate>=1.14.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "onnxscript>=0.7.1",
    "pyarrow>=25.0.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]
tierc = [
    "openai>=2.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
