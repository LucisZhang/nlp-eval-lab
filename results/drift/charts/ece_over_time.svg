   <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(5.184 375.557425)">Evidence class: MEASURED — copied from results/runs.jsonl run records.</text>
   <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(5.184 383.239175)">TIER C EXCLUDED BY CONSTRUCTION: structured output returns one label, so its p_max is a degenerate one-hot 1.0 on every row and ECE collapses to the error</text>
